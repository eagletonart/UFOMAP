<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #050e0a; color: #a0e8c8; font-family: 'Share Tech Mono', monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

#conn-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 20px;
  border-bottom: 1px solid #0f4;
  background: #050e0a;
  flex-shrink: 0;
}
#conn-header h1 { font-size: 0.85rem; letter-spacing: 0.2em; color: #0f4; }
#conn-header .stamp { color: #f44; font-size: 0.7rem; border: 1px solid #f44; padding: 2px 8px; letter-spacing: 0.15em; }
#close-btn { background: transparent; border: 1px solid #0f4; color: #0f4; padding: 6px 14px; cursor: pointer; font-family: 'Share Tech Mono', monospace; font-size: 0.75rem; letter-spacing: 0.1em; }
#close-btn:hover { background: #0f4; color: #050e0a; }

#canvas-wrap {
  flex: 1;
  overflow: hidden;
  position: relative;
  cursor: grab;
}
#canvas-wrap:active { cursor: grabbing; }

#diagram-canvas {
  position: absolute;
  top: 0; left: 0;
  transform-origin: 0 0;
}

/* Node styles */
.node-group { cursor: pointer; }
.node-group:hover .node-ring { filter: brightness(1.3); }

.node-photo {
  width: 70px; height: 70px;
  border-radius: 50%;
  object-fit: cover;
  position: absolute;
  transform: translate(-35px, -35px);
}
.node-ring {
  width: 74px; height: 74px;
  border-radius: 50%;
  position: absolute;
  transform: translate(-37px, -37px);
  border: 3px solid #f44;
  background: transparent;
  pointer-events: none;
}
.node-ring.missing { border-color: #fa0; }
.node-ring.alive { border-color: #0f4; }
.node-ring.institution { border-color: #fa0; border-style: dashed; }

.node-label {
  position: absolute;
  transform: translate(-50%, 44px);
  white-space: nowrap;
  font-size: 12px;
  font-family: 'Share Tech Mono', monospace;
  color: #fff;
  background: rgba(0,0,0,0.85);
  padding: 2px 6px;
  border-radius: 2px;
  text-align: center;
  pointer-events: none;
  max-width: 120px;
  white-space: normal;
  text-align: center;
}

.node-emoji {
  width: 70px; height: 70px;
  border-radius: 50%;
  position: absolute;
  transform: translate(-35px, -35px);
  background: #0a1f14;
  display: flex; align-items: center; justify-content: center;
  font-size: 28px;
}

.cluster-label {
  position: absolute;
  font-size: 11px;
  letter-spacing: 0.15em;
  color: #0f4;
  background: rgba(0,0,0,0.7);
  padding: 2px 8px;
  pointer-events: none;
  text-transform: uppercase;
}

/* SVG canvas */
#conn-svg {
  position: absolute;
  top: 0; left: 0;
  pointer-events: none;
  overflow: visible;
}

/* Dossier panel */
#dossier {
  position: fixed;
  top: 0; right: -420px;
  width: 400px;
  height: 100vh;
  background: #050e0a;
  border-left: 1px solid #0a3;
  z-index: 100;
  transition: right 0.3s ease;
  overflow-y: auto;
  padding: 0;
}
#dossier.open { right: 0; }

.dossier-header {
  background: #0a1a10;
  border-bottom: 1px solid #0a3;
  padding: 12px 16px;
  display: flex; align-items: center; justify-content: space-between;
}
.dossier-stamp { color: #f44; font-size: 0.65rem; border: 1px solid #f44; padding: 2px 6px; letter-spacing: 0.1em; }
#dossier-close { background: transparent; border: none; color: #5a9; cursor: pointer; font-size: 1.2rem; font-family: 'Share Tech Mono', monospace; }

.dossier-body { padding: 20px 16px; }

.dossier-photo-wrap {
  display: flex; justify-content: center; margin-bottom: 16px;
}
.dossier-photo {
  width: 120px; height: 120px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid #f44;
}
.dossier-photo.missing { border-color: #fa0; }
.dossier-photo.alive { border-color: #0f4; }

.dossier-name { font-size: 1rem; color: #0f4; text-align: center; margin-bottom: 4px; letter-spacing: 0.1em; }
.dossier-status { font-size: 0.75rem; color: #f44; text-align: center; margin-bottom: 16px; }
.dossier-status.missing { color: #fa0; }
.dossier-status.alive { color: #0f4; }

.dossier-field { display: flex; gap: 8px; margin-bottom: 8px; font-size: 0.75rem; }
.dossier-field-icon { color: #0a3; }
.dossier-field-val { color: #8cc; }

.dossier-section { margin-top: 16px; padding-top: 16px; border-top: 1px solid #0a3; }
.dossier-section-title { font-size: 0.7rem; color: #5a9; letter-spacing: 0.2em; margin-bottom: 10px; }
.dossier-note { font-size: 0.78rem; color: #8cc; line-height: 1.6; }

.dossier-connection {
  margin-bottom: 8px; padding: 6px 10px;
  background: #0a1a10;
  border-left: 2px solid #fa0;
  font-size: 0.72rem;
}
.dossier-connection .conn-type { color: #fa0; font-size: 0.65rem; letter-spacing: 0.1em; }
.dossier-connection .conn-name { color: #a0e8c8; }

/* Legend */
#legend {
  position: fixed;
  bottom: 20px; left: 16px;
  font-size: 0.65rem;
  color: #5a9;
  pointer-events: none;
  z-index: 10;
}
.legend-item { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid; }

/* Zoom controls */
#zoom-controls {
  position: fixed;
  bottom: 20px; right: 20px;
  display: flex; gap: 6px;
  z-index: 10;
}
#zoom-controls button {
  background: #0a1a10;
  border: 1px solid #0a3;
  color: #0f4;
  width: 36px; height: 36px;
  cursor: pointer;
  font-family: 'Share Tech Mono', monospace;
  font-size: 1rem;
}
#zoom-controls button:hover { background: #0f3; color: #050e0a; }
</style>

  { id: 'zhangd',   name: 'Zhang Daibing',  emoji: '☢️', x: 1780, y: 300 },
  { id: 'liud',     name: 'Liu Donghao',    emoji: '☢️', x: 1520, y: 370 },
  { id: 'zhoug',    name: 'Zhou Guangyuan', emoji: '☢️', x: 1650, y: 370 },
  { id: 'lim',      name: 'Li Minyong',     emoji: '☢️', x: 1780, y: 370 },
];

const CANVAS_W = 2200;
const CANVAS_H = 2200;
const NASA_X = 1000;
const NASA_Y = 1000;

let scale = 0.55;
let panX = 0;
let panY = 0;
let isDragging = false;
let lastX = 0, lastY = 0;
let lastDist = 0;

const wrap = document.getElementById('canvas-wrap');
const canvas = document.getElementById('diagram-canvas');
const svg = document.getElementById('conn-svg');

function applyTransform() {
  canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
  canvas.style.width = CANVAS_W + 'px';
  canvas.style.height = CANVAS_H + 'px';
}

function zoom(factor) {
  const ww = wrap.clientWidth / 2;
  const wh = wrap.clientHeight / 2;
  panX = ww - (ww - panX) * factor;
  panY = wh - (wh - panY) * factor;
  scale *= factor;
  scale = Math.min(Math.max(scale, 0.15), 3);
  applyTransform();
}

function fitView() {
  const ww = wrap.clientWidth;
  const wh = wrap.clientHeight;
  scale = Math.min(ww / CANVAS_W, wh / CANVAS_H) * 0.9;
  panX = (ww - CANVAS_W * scale) / 2;
  panY = (wh - CANVAS_H * scale) / 2;
  applyTransform();
}

// Pan events
wrap.addEventListener('mousedown', e => {
  if (e.target.closest('.node-group') || e.target.closest('#dossier')) return;
  isDragging = true;
  lastX = e.clientX; lastY = e.clientY;
});
window.addEventListener('mousemove', e => {
  if (!isDragging) return;
  panX += e.clientX - lastX;
  panY += e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  applyTransform();
});
window.addEventListener('mouseup', () => isDragging = false);

wrap.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.015 : 0.985;
  const rect = wrap.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  panX = mx - (mx - panX) * factor;
  panY = my - (my - panY) * factor;
  scale *= factor;
  scale = Math.min(Math.max(scale, 0.15), 3);
  applyTransform();
}, { passive: false });

// Touch/pinch
wrap.addEventListener('touchstart', e => {
  if (e.touches.length === 2) {
    lastDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
  } else if (e.touches.length === 1) {
    isDragging = true;
    lastX = e.touches[0].clientX;
    lastY = e.touches[0].clientY;
  }
}, { passive: true });

wrap.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 2) {
    const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    const factor = 1 + (dist - lastDist) * 0.001;
    lastDist = dist;
    const mx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    const my = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    const rect = wrap.getBoundingClientRect();
    const cx = mx - rect.left;
    const cy = my - rect.top;
    panX = cx - (cx - panX) * factor;
    panY = cy - (cy - panY) * factor;
    scale *= factor;
    scale = Math.min(Math.max(scale, 0.15), 3);
    applyTransform();
  } else if (e.touches.length === 1 && isDragging) {
    panX += e.touches[0].clientX - lastX;
    panY += e.touches[0].clientY - lastY;
    lastX = e.touches[0].clientX;
    lastY = e.touches[0].clientY;
    applyTransform();
  }
}, { passive: false });

wrap.addEventListener('touchend', () => isDragging = false);

function drawSVGLines() {
  svg.setAttribute('width', CANVAS_W);
  svg.setAttribute('height', CANVAS_H);
  svg.innerHTML = '';

  // Draw spokes from clusters to NASA hub
  for (const spoke of SPOKES) {
    const fromCluster = CLUSTERS[spoke.from];
    const toInst = spoke.to === 'nasa' ? { x: NASA_X, y: NASA_Y } : CLUSTERS[spoke.to];
    if (!fromCluster || !toInst) continue;

    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', fromCluster.cx);
    line.setAttribute('y1', fromCluster.cy);
    line.setAttribute('x2', toInst.x || toInst.cx);
    line.setAttribute('y2', toInst.y || toInst.cy);
    line.setAttribute('stroke', spoke.color);
    line.setAttribute('stroke-width', '2');
    line.setAttribute('stroke-dasharray', '8 5');
    line.setAttribute('opacity', '0.7');
    svg.appendChild(line);

    // Label at midpoint
    const mx = (fromCluster.cx + (toInst.x || toInst.cx)) / 2;
    const my = (fromCluster.cy + (toInst.y || toInst.cy)) / 2;
    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    text.setAttribute('x', mx);
    text.setAttribute('y', my - 6);
    text.setAttribute('text-anchor', 'middle');
    text.setAttribute('fill', spoke.color);
    text.setAttribute('font-size', '10');
    text.setAttribute('font-family', 'Share Tech Mono, monospace');
    text.setAttribute('opacity', '0.8');
    text.textContent = spoke.label;
    svg.appendChild(text);
  }

  // Cross connections between specific people
  for (const cc of CROSS_CONNECTIONS) {
    const fromPos = NODE_POSITIONS[cc.from];
    const toPos = NODE_POSITIONS[cc.to];
    if (!fromPos || !toPos) continue;

    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    const mx = (fromPos.x + toPos.x) / 2;
    const my = (fromPos.y + toPos.y) / 2 - 80;
    path.setAttribute('d', `M${fromPos.x},${fromPos.y} Q${mx},${my} ${toPos.x},${toPos.y}`);
    path.setAttribute('stroke', cc.color);
    path.setAttribute('stroke-width', '2');
    path.setAttribute('stroke-dasharray', '6 4');
    path.setAttribute('fill', 'none');
    path.setAttribute('opacity', '0.85');
    svg.appendChild(path);

    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    text.setAttribute('x', mx);
    text.setAttribute('y', my - 6);
    text.setAttribute('text-anchor', 'middle');
    text.setAttribute('fill', cc.color);
    text.setAttribute('font-size', '10');
    text.setAttribute('font-family', 'Share Tech Mono, monospace');
    text.textContent = cc.label;
    svg.appendChild(text);
  }

}

function createNode(scientist) {
  const pos = NODE_POSITIONS[scientist.id];
  if (!pos) return;

  const group = document.createElement('div');
  group.className = 'node-group';
  group.style.cssText = `position:absolute;left:${pos.x}px;top:${pos.y}px;width:0;height:0;`;

  const ring = document.createElement('div');
  ring.className = `node-ring ${scientist.status}`;
  group.appendChild(ring);

  const img = document.createElement('img');
  img.className = 'node-photo';
  img.src = scientist.photo;
  img.onerror = () => {
    img.style.display = 'none';
    const emoji = document.createElement('div');
    emoji.className = 'node-emoji';
    emoji.textContent = '👤';
    group.insertBefore(emoji, ring.nextSibling);
  };
  group.appendChild(img);

  const label = document.createElement('div');
  label.className = 'node-label';
  label.textContent = scientist.name;
  group.appendChild(label);

  group.addEventListener('click', e => {
    e.stopPropagation();
    openDossier(scientist);
  });

  canvas.appendChild(group);
}

function createInstitutionNode(inst) {
  const group = document.createElement('div');
  group.className = 'node-group';
  group.style.cssText = `position:absolute;left:${inst.x}px;top:${inst.y}px;width:0;height:0;`;

  const ring = document.createElement('div');
  ring.className = 'node-ring institution';
  group.appendChild(ring);

  const emoji = document.createElement('div');
  emoji.className = 'node-emoji';
  emoji.textContent = inst.emoji;
  group.appendChild(emoji);

  const label = document.createElement('div');
  label.className = 'node-label';
  label.style.color = '#fa0';
  label.textContent = inst.name;
  group.appendChild(label);

  canvas.appendChild(group);
}

function createChineseNode(sci) {
  const group = document.createElement('div');
  group.className = 'node-group';
  group.style.cssText = `position:absolute;left:${sci.x}px;top:${sci.y}px;width:0;height:0;`;

  const ring = document.createElement('div');
  ring.className = 'node-ring deceased';
  group.appendChild(ring);

  const emoji = document.createElement('div');
  emoji.className = 'node-emoji';
  emoji.textContent = sci.emoji;
  group.appendChild(emoji);

  const label = document.createElement('div');
  label.className = 'node-label';
  label.textContent = sci.name;
  group.appendChild(label);

  canvas.appendChild(group);
}

function createClusterLabel(name, cx, cy) {
  const label = document.createElement('div');
  label.className = 'cluster-label';
  label.textContent = name;
  label.style.cssText = `left:${cx-60}px;top:${cy-90}px;`;
  canvas.appendChild(label);
}

// NASA hub
function createNASAHub() {
  const group = document.createElement('div');
  group.className = 'node-group';
  group.style.cssText = `position:absolute;left:${NASA_X}px;top:${NASA_Y}px;width:0;height:0;`;

  const ring = document.createElement('div');
  ring.style.cssText = `width:90px;height:90px;border-radius:50%;position:absolute;transform:translate(-45px,-45px);border:3px solid #fa0;box-shadow:0 0 20px #fa044;background:#0a1a10;`;
  group.appendChild(ring);

  const emoji = document.createElement('div');
  emoji.style.cssText = `width:84px;height:84px;border-radius:50%;position:absolute;transform:translate(-42px,-42px);display:flex;align-items:center;justify-content:center;font-size:36px;`;
  emoji.textContent = '🚀';
  group.appendChild(emoji);

  const label = document.createElement('div');
  label.className = 'node-label';
  label.style.cssText = `transform:translate(-50%,52px);color:#fa0;font-size:13px;`;
  label.textContent = 'NASA HUB';
  group.appendChild(label);

  canvas.appendChild(group);
}

function openDossier(sci) {
  const body = document.getElementById('dossier-body');
  const statusText = sci.status === 'deceased' ? 'DECEASED' : sci.status === 'missing' ? 'MISSING' : 'ACTIVE';

  body.innerHTML = `
    <div class="dossier-photo-wrap">
      <img class="dossier-photo ${sci.status}" src="${sci.photo}" onerror="this.src='';this.style.display='none'">
    </div>
    <div class="dossier-name">${sci.name}</div>
    <div class="dossier-status ${sci.status}">${statusText} — ${sci.cluster}</div>
    <div class="dossier-field"><span class="dossier-field-icon">📅</span><span class="dossier-field-val">${sci.date}</span></div>
    <div class="dossier-field"><span class="dossier-field-icon">📍</span><span class="dossier-field-val">${sci.location}</span></div>
    <div class="dossier-field"><span class="dossier-field-icon">🏛</span><span class="dossier-field-val">${sci.institution}</span></div>
    <div class="dossier-section">
      <div class="dossier-section-title">BACKGROUND</div>
      <div class="dossier-note">${sci.notes}</div>
    </div>
    ${sci.connections && sci.connections.length ? `
    <div class="dossier-section">
      <div class="dossier-section-title">KNOWN CONNECTIONS</div>
      ${sci.connections.map(c => `
        <div class="dossier-connection">
          <div class="conn-type">► ${c.type}</div>
          <div class="conn-name">${c.name}</div>
        </div>
      `).join('')}
    </div>` : ''}
  `;

  document.getElementById('dossier').classList.add('open');
}

function closeDossier() {
  document.getElementById('dossier').classList.remove('open');
}

// Build everything
drawSVGLines();
createNASAHub();

for (const cluster of Object.keys(CLUSTERS)) {
  createClusterLabel(cluster, CLUSTERS[cluster].cx, CLUSTERS[cluster].cy);
}

for (const sci of SCIENTISTS) {
  createNode(sci);
}

for (const inst of INSTITUTIONS) {
  createInstitutionNode(inst);
}

for (const chi of CHINA_SCIENTISTS) {
  createChineseNode(chi);
}

// Initial fit
fitView();

</script>
</body>
</html>
