name: Rebuild Map

on:
  push:
    branches: [main]
  workflow_dispatch:   # lets you trigger a manual rebuild from GitHub UI

permissions:
  contents: write      # needed to push index.html back to the repo

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pdfplumber (imported by analyze_pursue_pdfs at module level)
        run: pip install pdfplumber

      - name: Fetch all data + build index.html
        # fetch_data.py pulls NUFORC CSV, Reddit r/ufos, Google News RSS,
        # then auto-subprocesses build_map.py at the end — one step does it all.
        # Failures in individual sources are caught internally and never raise,
        # so a flaky Reddit API won't break the whole build.
        run: python3 fetch_data.py
        env:
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}

      - name: Commit and push updated index.html
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          # Only commit if index.html actually changed
          git diff --cached --quiet && echo "index.html unchanged, skipping commit" || \
            git commit -m "chore: auto-rebuild index.html [skip ci]" && git push
