name: Signal Monitor

on:
  schedule:
    - cron: '0 */2 * * *'   # every 2 hours — faster cadence than Babel
  workflow_dispatch:          # manual trigger

permissions:
  contents: write

jobs:
  signal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Signal Monitor
        run: python3 signal_monitor.py

      - name: Commit updated signal detections
        run: |
          git config user.name  "signal-monitor[bot]"
          git config user.email "signal-monitor[bot]@users.noreply.github.com"
          git add signal_detections.json
          if git diff --cached --quiet; then
            echo "Nothing to commit — no new signals"
          else
            TIMESTAMP=$(date -u +%Y-%m-%dT%H:%MZ)
            COUNT=$(python3 -c "import json; d=json.load(open('signal_detections.json')); print(len(d))" 2>/dev/null || echo "?")
            git commit -m "signal: ${COUNT} total signals at ${TIMESTAMP} [skip ci]"
            git push
          fi
