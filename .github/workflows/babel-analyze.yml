name: Babel Analyzer

on:
  workflow_run:
    workflows: ["Babel Monitor"]
    types: [completed]
  workflow_dispatch:          # manual trigger from GitHub Actions UI
    inputs:
      limit:
        description: 'Max documents to analyze (leave blank for all)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    # Only run if monitor succeeded (or if triggered manually)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Pull latest — babel_detections.json may have just been updated by monitor
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic pdfplumber

      - name: Run Babel Analyzer
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.limit }}" ]; then
            python3 babel_analyze.py --limit ${{ github.event.inputs.limit }}
          else
            python3 babel_analyze.py --limit 20
          fi

      - name: Commit intelligence and updated detections
        run: |
          git config user.name  "babel-analyzer[bot]"
          git config user.email "babel-analyzer[bot]@users.noreply.github.com"
          git add --ignore-missing babel_intelligence.json babel_detections.json
          if git diff --cached --quiet; then
            echo "Nothing to commit — no new documents analyzed"
          else
            TIMESTAMP=$(date -u +%Y-%m-%dT%H:%MZ)
            COUNT=$(git diff --cached --name-only | wc -l | tr -d ' ')
            git commit -m "babel: intelligence update ${TIMESTAMP} [skip ci]"
            git push
          fi
