name: Watch war.gov for New UAP Releases

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:        # allow manual trigger from GitHub UI
    inputs:
      reset:
        description: 'Reset state (re-baseline everything)'
        required: false
        default: 'false'

jobs:
  watch:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to commit updated state file
      issues: write         # needed to create alert issues

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore watcher state
        id: cache-state
        uses: actions/cache@v4
        with:
          path: war_gov_state.json
          key: war-gov-state-${{ github.run_id }}
          restore-keys: |
            war-gov-state-

      - name: Reset state (if requested)
        if: github.event.inputs.reset == 'true'
        run: rm -f war_gov_state.json && echo "State reset."

      - name: Run watcher
        id: watcher
        run: |
          python3 watch_war_gov.py --notify --ci 2>&1 | tee watcher_output.txt
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Read watcher output
        id: read_output
        run: |
          OUTPUT=$(cat watcher_output.txt)
          # Truncate for GitHub env var limit
          echo "output<<EOF" >> $GITHUB_OUTPUT
          echo "$OUTPUT" | head -100 >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Issue on new content
        if: steps.watcher.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let alertsBody = '';
            try {
              const alerts = JSON.parse(fs.readFileSync('war_gov_alerts.json', 'utf8'));
              const recent = alerts.filter(a => {
                const t = new Date(a.detected_at || 0);
                return (Date.now() - t) < 7 * 3600 * 1000; // last 7 hours
              });
              alertsBody = recent.map(a => `- **${a.type}**: ${a.message || a.url || JSON.stringify(a)}`).join('\n');
            } catch (e) {
              alertsBody = 'Could not read alerts file.';
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 New PURSUE UAP Content Detected — ${new Date().toISOString().split('T')[0]}`,
              body: `## New content detected on war.gov/UAP\n\n${alertsBody}\n\n---\n*Auto-generated by [watch-war-gov.yml](/.github/workflows/watch-war-gov.yml) at ${new Date().toISOString()}*\n\n**Next steps:**\n1. Check war.gov/UAP for new files\n2. Run \`python3 download_pursue.py\` to get new PDFs\n3. Run \`python3 download_pursue_videos.py\` to get new videos\n4. Run \`python3 analyze_pursue_pdfs.py\` then \`python3 build_map.py\``,
              labels: ['uap-release', 'automated'],
            });

      - name: Commit updated state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add war_gov_state.json war_gov_alerts.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: update war.gov watcher state [skip ci]"
          git push || true

      - name: Summary
        run: |
          echo "## war.gov Watch Results" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat watcher_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
