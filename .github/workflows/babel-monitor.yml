name: Babel Monitor

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC
  workflow_dispatch:          # manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Babel Monitor
        run: python3 babel_monitor.py

      - name: Commit updated snapshots and detections
        run: |
          git config user.name  "babel-monitor[bot]"
          git config user.email "babel-monitor[bot]@users.noreply.github.com"
          git add babel_snapshots.json babel_detections.json
          if git diff --cached --quiet; then
            echo "Nothing to commit — no changes detected"
          else
            TIMESTAMP=$(date -u +%Y-%m-%dT%H:%MZ)
            if [ -f babel_new.txt ]; then
              COUNT=$(wc -l < babel_new.txt | tr -d ' ')
              git commit -m "babel: ${COUNT} new detection(s) at ${TIMESTAMP} [skip ci]"
            else
              git commit -m "babel: snapshot update ${TIMESTAMP} [skip ci]"
            fi
            git push
          fi
          rm -f babel_new.txt
